# LUU Y: file nay PHAI la ASCII thuan.
# Alembic doc alembic.ini bang encoding="locale" (cp1252 tren Windows VN), nen bat ky
# ky tu co dau nao trong file nay se lam alembic crash voi UnicodeDecodeError truoc
# khi no chay bat cu lenh nao. Comment tieng Viet co dau thuoc ve .py, khong phai day.

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamp trong ten file de migration sort theo thoi gian, khong theo hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# DE TRONG co chu dich: env.py doc URL (kem password) tu Settings.
# Khong commit secret vao file ini.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
