# CHỈ tool config. Cố ý KHÔNG có [build-system] / [project]: chạy bằng
# `python -m app.cli` và `python -m uvicorn app.main:app` từ project root, không
# `pip install -e .` — tránh ma sát build backend trên Windows khi không có uv.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: cần PostgreSQL thật (bỏ qua nếu không có TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # độ dài dòng do formatter lo
    "RUF001",  # chuỗi tiếng Việt có ký tự Unicode gần giống ASCII
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
